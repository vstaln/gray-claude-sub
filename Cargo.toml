[package]
name = "gray-claude-sub"
version = "0.1.4"
edition = "2024"
license = "MIT"
description = "Claude subscription provider sidecar plugin for the gray agent harness"

[lib]
name = "claude_sub"
path = "src/lib.rs"

[[bin]]
name = "claude-sub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Pinned to a rev carrying `request.cache_ttl_secs` (gray PR #193); drop
# the pin once that lands on main.
gray-plugin = { git = "https://github.com/vstaln/gray.git", rev = "2482aeb7ca7bf4dc2ece6338c8e40d4192b6791b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

[profile.release]
strip = true
