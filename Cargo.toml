[package]
name = "gray-claude-sub"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Claude subscription provider sidecar plugin for the gray agent harness"

[lib]
name = "claude_sub"
path = "src/lib.rs"

[[bin]]
name = "claude-sub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gray-core = { git = "https://github.com/vstaln/gray.git" }
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

[profile.release]
strip = true

# Dev builds: full DWARF bloats the binary and every edit pays the link.
# Line tables keep file:line in panics and backtraces; deps carry none
# (nobody steps into tokio). Need a debugger? CARGO_PROFILE_DEV_DEBUG=2
# for that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
