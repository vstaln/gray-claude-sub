[package]
name = "gray-claude-sub"
version = "0.1.5"
edition = "2024"
license = "MIT"
description = "Claude subscription provider sidecar plugin for the gray agent harness"

[lib]
name = "claude_sub"
path = "src/lib.rs"

[[bin]]
name = "claude-sub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

[profile.release]
strip = true
