[package]
name = "gray-claude-sub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Claude subscription provider plugin and direct provider for the gray agent harness"

[lib]
name = "claude_sub"
path = "src/lib.rs"

[[bin]]
name = "claude-sub"
path = "src/main.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
gray-core = { git = "https://github.com/vstaln/gray.git" }
gray-plugin = { git = "https://github.com/vstaln/gray.git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

[profile.release]
strip = true
